# @package _global_
# Hard-phrase biased CLIP VG config with auxiliary GT mask alignment loss.
defaults:
  - /experiment/projects/prompting/vg/prompt_vg_small14_dinov2_mapping_lang_point_pred_sep_clip_biased
  - _self_

losses:
  mask_loss:
    _target_: routed.ocl.losses.ControlMaskReconstructionLoss
    loss_type: bce
    weight: 0.2
    input_path: object_decoder.masks_as_image
    target_path: input.instance_mask_v2
    control_mask_path: input.selected_indices
