# @package _global_
# CLIP VG smoke config that exercises a 336x336 image path with ViT-S/14.
defaults:
  - /experiment/projects/prompting/vg/prompt_vg_small14_dinov2_mapping_lang_point_pred_sep_clip
  - _self_

experiment:
  image_size: 336
  batch_size_per_gpu: 32

dataset:
  eval_transforms:
    03c_preprocessing:
      transforms:
        image:
          _target_: torchvision.transforms.Compose
          transforms:
            - "${lambda_fn:'lambda image: image.copy()'}"
            - _target_: torchvision.transforms.v2.ToImage
            - _target_: torchvision.transforms.v2.Resize
              size: ${experiment.image_size}
              interpolation: ${torchvision_interpolation_mode:BICUBIC}
              antialias: true
            - _target_: torchvision.transforms.v2.ToDtype
              dtype: ${torch_dtype:float32}
              scale: true
            - _target_: torchvision.transforms.v2.Normalize
              mean: [0.485, 0.456, 0.406]
              std: [0.229, 0.224, 0.225]
        instance_mask:
          _target_: torchvision.transforms.Compose
          transforms:
            - _target_: ocl.preprocessing.IntegerToOneHotMask
              output_axis: -3
            - _target_: ocl.preprocessing.AddEmptyMasksVG
            - _target_: ocl.preprocessing.DenseMaskToTensor
            - _target_: ocl.preprocessing.ResizeNearestExact
              size: ${experiment.mask_size}
        instance_mask_v2:
          _target_: torchvision.transforms.Compose
          transforms:
            - _target_: ocl.preprocessing.IntegerToOneHotMask
              output_axis: -3
            - _target_: ocl.preprocessing.AddEmptyMasksVG
            - _target_: ocl.preprocessing.DenseMaskToTensor
            - _target_: ocl.preprocessing.ResizeNearestExact
              size: ${experiment.mask_size}
  train_transforms:
    03b_preprocessing:
      transforms:
        image:
          _target_: torchvision.transforms.Compose
          transforms:
            - "${lambda_fn:'lambda image: image.copy()'}"
            - _target_: torchvision.transforms.v2.ToImage
            - _target_: torchvision.transforms.v2.Resize
              size: ${experiment.image_size}
              interpolation: ${torchvision_interpolation_mode:BICUBIC}
              antialias: true
            - _target_: torchvision.transforms.v2.ToDtype
              dtype: ${torch_dtype:float32}
              scale: true
            - _target_: torchvision.transforms.v2.Normalize
              mean: [0.485, 0.456, 0.406]
              std: [0.229, 0.224, 0.225]
        instance_mask:
          _target_: torchvision.transforms.Compose
          transforms:
            - _target_: ocl.preprocessing.IntegerToOneHotMask
              output_axis: -3
            - _target_: ocl.preprocessing.AddEmptyMasksVG
            - _target_: ocl.preprocessing.DenseMaskToTensor
            - _target_: ocl.preprocessing.ResizeNearestExact
              size: ${experiment.mask_size}
        instance_mask_v2:
          _target_: torchvision.transforms.Compose
          transforms:
            - _target_: ocl.preprocessing.IntegerToOneHotMask
              output_axis: -3
            - _target_: ocl.preprocessing.AddEmptyMasksVG
            - _target_: ocl.preprocessing.DenseMaskToTensor
            - _target_: ocl.preprocessing.ResizeNearestExact
              size: ${experiment.mask_size}
